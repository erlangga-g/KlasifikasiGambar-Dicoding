[project]
name = "klasifikasigambar-dicoding"
version = "0.1.0"
description = "Klasifikasi gestur rock-paper-scissors dengan CNN (proyek akhir Dicoding)"
readme = "README.md"
requires-python = ">=3.11,<3.12" #TF 2.15 tidak punya wheel 3.12
dependencies = [
    "matplotlib>=3.8.0",  
    "numpy<2",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "tensorflow==2.15.*",
    "tensorflowjs>=4.22.0",
]
[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib-inline>=0.2.2",
    "nbqa>=1.10.0",
    "nbstripout>=0.9.2",
    "ruff>=0.17.6",
    "stack-data>=0.6.3",
]

